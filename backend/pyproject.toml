[project]
name = "hackathon-backend"
version = "0.1.0"
description = "Hackathon backend template with FastAPI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Auth
    "pyjwt>=2.9.0",
    "bcrypt>=4.2.0",
    # File uploads
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
]

[project.scripts]
dev = "uvicorn app.main:app --reload"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

